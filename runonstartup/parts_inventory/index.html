<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organizer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=debug24">
    <meta name="description" content="Track and search your component order history from LCSC and DigiKey.">
</head>

<body>
    <div class="app-container">
        <!-- SIDEBAR: Search & List -->
        <aside class="sidebar">
            <div class="controls">
                <div class="search-bar">
                    <input type="text" id="searchInput" placeholder="Search components..." autofocus>
                    <div class="search-icon">
                        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                        </svg>
                    </div>
                    <button id="clearSearch"
                        style="display:none; position:absolute; right:10px; top:50%; transform:translateY(-50%); background:none; border:none; color:#666; cursor:pointer;">✕</button>
                </div>

                <div class="stats-row">
                    <div style="display:flex; gap:10px;">
                        <button id="addManualBtn" class="secondary-btn small" title="Add Custom Item">
                            <span>+</span> Item
                        </button>
                        <button id="uploadTrigger" class="secondary-btn small" title="Import CSV">
                            <span>↑</span> Import
                        </button>
                        <input type="file" id="csvFileInput" accept=".csv" style="display: none;">
                    </div>
                </div>
            </div>

            <div id="resultsArea" class="results-list">
                <!-- Items populated by JS -->
                <div class="empty-state" style="padding:20px; text-align:center; color:#666;">
                    <p>No items found.</p>
                </div>
            </div>

            <div style="padding:10px; border-top:1px solid #333; font-size:0.8rem; color:#666; text-align:center;">
                <span id="itemCount">0 items</span> •
                <button id="clearDataBtn" class="text-btn danger">Clear Data</button>
            </div>
        </aside>

        <!-- MAIN: Box Organizer (Zoomable) -->
        <main class="main-viewport" id="mainViewport">
            <!-- HUD -->
            <div class="viewport-hud">
                <button id="resetViewBtn" class="icon-btn" title="Reset View">
                    <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4">
                        </path>
                    </svg>
                </button>
            </div>

            <div id="zoomContainer" class="zoom-container">
                <div id="boxOrganizerPanel" class="box-panel-content">
                    <div class="box-segment-label" style="text-align:center; margin-bottom:10px; color:#555;">TOP
                        SEGMENT (6x12)</div>
                    <div id="boxTopSegment" class="box-segment"></div>

                    <div class="mid-spacer"></div>

                    <div class="box-segment-label" style="text-align:center; margin-bottom:10px; color:#555;">BOTTOM
                        SEGMENT (4x6)</div>
                    <div id="boxBottomSegment" class="box-segment"></div>
                </div>
            </div>
        </main>
    </div>

    <!-- Manual Item Modal -->
    <div id="modalOverlay" class="modal-overlay hidden">
        <div class="modal glass-panel">
            <h2>Add Custom Item</h2>
            <form id="manualItemForm">
                <div class="form-group">
                    <label>Part Number</label>
                    <input type="text" id="mPartNum" required
                        style="width:100%; padding:8px; border-radius:4px; border:1px solid #444; background:#222; color:#fff;">
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <input type="text" id="mDesc"
                        style="width:100%; padding:8px; border-radius:4px; border:1px solid #444; background:#222; color:#fff;">
                </div>
                <!-- Simplified for brevity, detailed fields in JS/Logic handled similarly -->
                <div class="modal-actions" style="margin-top:20px; display:flex; justify-content:flex-end; gap:10px;">
                    <button type="button" id="cancelModalBtn" class="text-btn">Cancel</button>
                    <button type="submit" class="action-link">Add</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Box Label Edit Modal -->
    <div id="boxEditModal" class="modal-overlay hidden">
        <div class="modal glass-panel" style="max-width: 300px;">
            <h3>Edit Cell Label</h3>
            <form id="boxEditForm">
                <input type="hidden" id="editItemId">
                <div class="form-group">
                    <label>Main Label (Value/Name)</label>
                    <textarea id="editLabelMain" rows="1"
                        style="width:100%; padding:8px; border-radius:4px; border:1px solid #444; background:#222; color:#fff; resize:none;"></textarea>
                </div>
                <div class="form-group">
                    <label>Sub Label (Type)</label>
                    <textarea id="editLabelSub" rows="1"
                        style="width:100%; padding:8px; border-radius:4px; border:1px solid #444; background:#222; color:#fff; resize:none;"></textarea>
                </div>
                <div class="form-group">
                    <label>Size / Package</label>
                    <input type="text" id="editLabelSize"
                        style="width:100%; padding:8px; border-radius:4px; border:1px solid #444; background:#222; color:#fff;">
                </div>
                <div class="modal-actions" style="margin-top:20px; display:flex; justify-content:space-between;">
                    <button type="button" id="deleteBoxItemBtn" class="text-btn danger">Remove</button>
                    <div style="display:flex; gap:10px;">
                        <button type="button" id="cancelBoxEditBtn" class="text-btn">Cancel</button>
                        <button type="submit" class="action-link">Save</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="toast hidden">Message</div>

    <script src="app.js?v=debug21"></script>
</body>

</html>
