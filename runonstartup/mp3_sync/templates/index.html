<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MP3 Sync</title>
    <style>
        :root {
            --bg-dark: #000000;
            --accent-primary: #ffffff;
            --accent-secondary: #00ffff;
            --text-main: #ffffff;
            --text-muted: #cccccc;
            --border-color: #ffffff;
            --border-subtle: #333333;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg-dark);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            padding: 40px 20px;
        }

        h1 {
            font-size: 24px;
            font-weight: 300;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 32px;
            border-bottom: 1px solid var(--border-subtle);
            padding-bottom: 12px;
        }

        h1 span { color: var(--accent-secondary); }

        .section {
            border: 1px solid var(--border-subtle);
            padding: 20px;
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-muted);
            margin-bottom: 16px;
        }

        .field {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .field:last-child { margin-bottom: 0; }

        .field label {
            font-size: 13px;
            color: var(--text-muted);
            min-width: 140px;
        }

        .field input[type="text"] {
            flex: 1;
            background: transparent;
            border: 1px solid var(--border-subtle);
            color: var(--text-main);
            padding: 8px 12px;
            font-size: 13px;
            font-family: monospace;
        }

        .field input[type="text"]:focus {
            outline: none;
            border-color: var(--accent-secondary);
        }

        .toggle {
            position: relative;
            width: 36px;
            height: 18px;
            cursor: pointer;
        }

        .toggle input { display: none; }

        .toggle .slider {
            position: absolute;
            inset: 0;
            background: var(--border-subtle);
            transition: 0.2s;
        }

        .toggle .slider::before {
            content: '';
            position: absolute;
            width: 14px;
            height: 14px;
            left: 2px;
            top: 2px;
            background: var(--text-muted);
            transition: 0.2s;
        }

        .toggle input:checked + .slider {
            background: var(--accent-secondary);
        }

        .toggle input:checked + .slider::before {
            transform: translateX(18px);
            background: #000;
        }

        .btn {
            padding: 8px 20px;
            border: 1px solid var(--border-subtle);
            background: transparent;
            color: var(--text-main);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.15s;
        }

        .btn:hover:not(:disabled) {
            border-color: var(--accent-secondary);
            color: var(--accent-secondary);
        }

        .btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .btn-primary {
            border-color: var(--accent-secondary);
            color: var(--accent-secondary);
        }

        .btn-primary:hover:not(:disabled) {
            background: var(--accent-secondary);
            color: #000;
        }

        .btn-danger {
            border-color: #f87171;
            color: #f87171;
        }

        .btn-danger:hover:not(:disabled) {
            background: #f87171;
            color: #000;
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 4px;
        }

        /* Progress */
        .progress-bar {
            height: 2px;
            background: var(--border-subtle);
            margin: 12px 0;
        }

        .progress-bar .fill {
            height: 100%;
            background: var(--accent-secondary);
            transition: width 0.3s;
            width: 0%;
        }

        .status-line {
            font-size: 12px;
            color: var(--text-muted);
            margin: 6px 0;
            font-family: monospace;
        }

        .status-line.active { color: var(--accent-secondary); }

        .error-list {
            margin-top: 10px;
            max-height: 120px;
            overflow-y: auto;
        }

        .error-item {
            font-size: 11px;
            color: #f87171;
            font-family: monospace;
            padding: 2px 0;
        }

        /* Password modal */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.92);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }

        .modal.show { display: flex; }

        .modal-box {
            border: 1px solid var(--border-subtle);
            padding: 24px;
            background: #000;
            text-align: center;
        }

        .modal-box input {
            background: transparent;
            border: 1px solid var(--border-subtle);
            color: var(--text-main);
            padding: 10px 16px;
            font-size: 14px;
            width: 160px;
            text-align: center;
        }

        .modal-box input:focus {
            outline: none;
            border-color: var(--accent-secondary);
        }

        .modal-box button {
            background: var(--border-subtle);
            border: none;
            color: var(--text-main);
            padding: 10px 20px;
            font-size: 14px;
            cursor: pointer;
            margin-left: 8px;
        }

        .modal-box .error { color: #f87171; margin-top: 10px; font-size: 12px; }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 10px 20px;
            border: 1px solid var(--accent-secondary);
            background: #000;
            color: var(--accent-secondary);
            font-size: 12px;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 200;
        }

        .toast.show { opacity: 1; }
    </style>
</head>
<body>
    <h1>MP3 <span>Sync</span></h1>

    <!-- Config Section -->
    <div class="section">
        <div class="section-title">Configuration</div>
        <div class="field">
            <label>Download Folder</label>
            <input type="text" id="download-folder" placeholder="C:\Users\...">
        </div>
        <div class="field">
            <label>Liked Music</label>
            <label class="toggle">
                <input type="checkbox" id="sync-liked">
                <span class="slider"></span>
            </label>
        </div>
        <div class="field">
            <label>All Playlists</label>
            <label class="toggle">
                <input type="checkbox" id="sync-playlists">
                <span class="slider"></span>
            </label>
        </div>
        <div class="actions">
            <button class="btn" onclick="saveConfig()">Save</button>
        </div>
    </div>

    <!-- Sync Section -->
    <div class="section">
        <div class="section-title">Sync</div>
        <div class="actions">
            <button class="btn btn-primary" id="btn-sync" onclick="startSync()">Sync Now</button>
            <button class="btn btn-danger" id="btn-stop" onclick="stopSync()" disabled>Stop</button>
        </div>
        <div class="progress-bar"><div class="fill" id="progress-fill"></div></div>
        <div class="status-line" id="status-playlist"></div>
        <div class="status-line" id="status-track"></div>
        <div class="status-line" id="status-count"></div>
        <div class="status-line" id="status-last"></div>
        <div class="error-list" id="error-list"></div>
    </div>

    <!-- Password Modal -->
    <div id="pw-modal" class="modal">
        <div class="modal-box">
            <input type="password" id="pw-input" placeholder="•••••">
            <button onclick="submitPassword()">Go</button>
            <div id="pw-error" class="error"></div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        let password = sessionStorage.getItem('pw') || '';
        let pendingAction = null;

        // ── Load config ────────────────────
        async function loadConfig() {
            try {
                const resp = await fetch('/api/config');
                const data = await resp.json();
                document.getElementById('download-folder').value = data.download_folder || '';
                document.getElementById('sync-liked').checked = data.sync_liked_music !== false;
                document.getElementById('sync-playlists').checked = data.sync_all_playlists !== false;
            } catch(e) { console.error(e); }
        }

        // ── Save config ────────────────────
        function saveConfig() {
            const data = {
                download_folder: document.getElementById('download-folder').value,
                sync_liked_music: document.getElementById('sync-liked').checked,
                sync_all_playlists: document.getElementById('sync-playlists').checked,
            };
            doAuthAction('/api/config', 'POST', data, (resp) => {
                if (resp.success) toast('Config saved');
            });
        }

        // ── Sync control ───────────────────
        function startSync() {
            doAuthAction('/api/sync', 'POST', null, (resp) => {
                if (resp.success) toast('Sync started');
            });
        }

        function stopSync() {
            doAuthAction('/api/sync/stop', 'POST', null, (resp) => {
                if (resp.success) toast('Sync stopping...');
            });
        }

        // ── Poll sync status ───────────────
        async function pollStatus() {
            try {
                const resp = await fetch('/api/sync/status');
                const s = await resp.json();

                document.getElementById('btn-sync').disabled = s.running;
                document.getElementById('btn-stop').disabled = !s.running;

                const pct = s.tracks_total > 0 ? (s.tracks_done / s.tracks_total * 100) : 0;
                document.getElementById('progress-fill').style.width = pct + '%';

                const playlistEl = document.getElementById('status-playlist');
                const trackEl = document.getElementById('status-track');
                const countEl = document.getElementById('status-count');
                const lastEl = document.getElementById('status-last');

                if (s.running) {
                    playlistEl.textContent = `playlist: ${s.current_playlist} (${s.playlists_done}/${s.playlists_total})`;
                    playlistEl.className = 'status-line active';
                    trackEl.textContent = `track: ${s.current_track}`;
                    countEl.textContent = `progress: ${s.tracks_done}/${s.tracks_total}`;
                } else {
                    playlistEl.textContent = '';
                    playlistEl.className = 'status-line';
                    trackEl.textContent = '';
                    countEl.textContent = s.tracks_total > 0 ? `done: ${s.tracks_done}/${s.tracks_total}` : '';
                }

                lastEl.textContent = s.last_sync ? `last sync: ${s.last_sync}` : '';

                // Errors
                const el = document.getElementById('error-list');
                el.innerHTML = s.errors.map(e => `<div class="error-item">${e}</div>`).join('');

            } catch(e) { console.error(e); }
        }

        // ── Auth helper ────────────────────
        function doAuthAction(url, method, body, callback) {
            if (!password) {
                pendingAction = { url, method, body, callback };
                document.getElementById('pw-modal').classList.add('show');
                document.getElementById('pw-input').focus();
                document.getElementById('pw-error').textContent = '';
                return;
            }
            executeAction(url, method, body, callback);
        }

        async function executeAction(url, method, body, callback) {
            try {
                const opts = {
                    method,
                    headers: { 'X-Password': password },
                };
                if (body) {
                    opts.headers['Content-Type'] = 'application/json';
                    opts.body = JSON.stringify(body);
                }
                const resp = await fetch(url, opts);
                const data = await resp.json();
                if (data.success === false && data.message === 'Invalid password') {
                    password = '';
                    sessionStorage.removeItem('pw');
                    pendingAction = { url, method, body, callback };
                    document.getElementById('pw-modal').classList.add('show');
                    document.getElementById('pw-input').focus();
                    document.getElementById('pw-error').textContent = 'Invalid password';
                    return;
                }
                if (callback) callback(data);
            } catch(e) { console.error(e); }
        }

        async function submitPassword() {
            password = document.getElementById('pw-input').value;
            sessionStorage.setItem('pw', password);
            document.getElementById('pw-modal').classList.remove('show');
            document.getElementById('pw-input').value = '';
            if (pendingAction) {
                const { url, method, body, callback } = pendingAction;
                pendingAction = null;
                executeAction(url, method, body, callback);
            }
        }

        document.getElementById('pw-input').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') submitPassword();
            if (e.key === 'Escape') {
                document.getElementById('pw-modal').classList.remove('show');
                pendingAction = null;
            }
        });

        function toast(msg) {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 2000);
        }

        // ── Init ───────────────────────────
        loadConfig();
        pollStatus();
        setInterval(pollStatus, 3000);
    </script>
</body>
</html>
